<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"

<body>
    <nav class="navbar navbar-dark  " aria-label="First navbar example">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Post App</a>
        </div>
    </nav>
    <div class="container-fluid">
        <div class="row">
            <div class="col-12 col-sm-12 col-md-6 col-lg-4">
                <div class="main p-4">
                    <div class="card p-3">
               
                    <div class="mb-3">
                        <label for="exampleInputEmail1" class="form-label">Title</label>
                        <input id="title" type="text" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
                        
                    </div>
                    <div class="mb-3">
                        <label for="exampleFormControlTextarea1" class="form-label">Description</label>
                        <textarea id="description" class="form-control" id="exampleFormControlTextarea1" rows="3"></textarea>
                      </div>
                    
                    <button type="submit" class="btn btn-primary" onclick="addPost()">Post</button>
               
            </div>
            </div>
            </div>
            <div class="col-12 col-sm-12 col-md-8 col-lg-8">
                <div class="main p-4" id="post-container">
                
            </div>
            </div>
        </div>
    </div>
